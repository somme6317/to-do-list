<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive To-Do List</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-container">
<header class="header">
<h1>Interactive To-Do List</h1>
<p class="subtitle">Organize your tasks seamlessly</p>
</header>
<!-- Task Form / Input -->
<form id="todo-form" class="todo-form">
<div class="input-group">
<input
type="text"
id="task-input"
name="task"
placeholder="What needs to be done?"
autocomplete="off"
required
/>
<button type="submit" id="add-btn" class="btn btn-primary">Add Task</button>
</div>
<i class="fa-solid fa-arrow-right text-xs"></i>
</button>
<small id="check" class="validation-msg"></small>
</form>
<!-- Filter Buttons -->
<div class="filter-container">
<button class="filter-btn active" data-filter="all">All</button>
<button class="filter-btn" data-filter="active">Active</button>
<button class="filter-btn" data-filter="completed">Completed</button>
</div>
<!-- Task List -->
<ul id="todo-list" class="todo-list"></ul>
<!-- Footer Stats & Actions -->
<div class="footer">
<span id="items-left">0 items left</span>
<button id="clear-completed" class="btn-text">Clear Completed</button>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
